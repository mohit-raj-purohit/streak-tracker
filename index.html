<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="description" content="Track your daily habits and build streaks." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Streaks" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Streak Tracker</title>
  </head>
  <body>
    <!-- Debug: if you see this text, HTML is loading but JS may be failing -->
    <noscript>
      <p style="color: white; padding: 40px; text-align: center; font-family: sans-serif;">
        Please enable JavaScript to use Streak Tracker.
      </p>
    </noscript>
    <p id="debug-text" style="color: #c9a84c; padding: 20px; text-align: center; font-family: sans-serif; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; background: #0c0c0e;">
      Loading Streak Tracker...
    </p>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide debug text once React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var el = document.getElementById('debug-text');
          if (el) el.style.display = 'none';
        }, 3000);
      });
    </script>
  </body>
</html>
